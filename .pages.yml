media:
  - name: images
    label: 图片
    input: public/media
    output: /media
    categories: [image]

content:
  - name: blog
    label: 博客文章
    type: collection
    path: src/content/blog
    filename: '{fields.slug}.md'
    view:
      fields: [title, pubDate]
      sort: pubDate
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: slug
        label: 网址文件名
        type: string
        required: true
        description: 英文小写字母、数字和横线,决定文章网址,如 my-first-post
        pattern: '^[a-z0-9-]+$'
      - name: description
        label: 描述
        type: text
        required: true
      - name: pubDate
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: 更新日期
        type: date
        options:
          format: yyyy-MM-dd
      - name: heroImage
        label: 封面图
        type: image
      - name: body
        label: 正文
        type: rich-text
